name: 3GPP 会议酒店监控

on:
  schedule:
    # 每 15 分钟一次（UTC）。错开整点，避开 GitHub 高峰
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:          # 手动触发（Actions 页面点 Run workflow）
    inputs:
      test_send:
        description: '发送测试卡片验证推送通道'
        type: boolean
        default: false
  push:
    branches: [main, master]

jobs:
  monitor:
    # 钉住版本，避免 ubuntu-latest 迁移带来的提示和意外变化
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 需要把「已通知」状态提交回仓库，所以要写权限
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 测试推送通道
        if: ${{ inputs.test_send }}
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_API_SECRET: ${{ secrets.WECOM_API_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python monitor.py --test-send

      - name: 运行监控
        if: ${{ !inputs.test_send }}
        env:
          # —— 密钥全部来自 GitHub Secrets，不写在代码里 ——
          # 群机器人（无 IP 限制，推荐 GitHub Actions 用这个）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 自建应用（有 IP 白名单限制，本地跑可用；GitHub 上配了可能报 60020）
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_API_SECRET: ${{ secrets.WECOM_API_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 监控哪些组（可在仓库 Settings → Variables 里用 GROUPS 覆盖）
          GROUPS: ${{ vars.GROUPS || 'RAN1,RAN2,RAN3,RAN4,RAN5,RAN6,SA1,SA2,SA3,SA4,SA5,SA6,RAN(全部),SA(全部)' }}
        run: python monitor.py --volumes 2

      # 只有「已通知」状态变了才提交，避免每次都产生无意义 commit
      - name: 保存状态
        run: |
          git config user.name  "3gpp-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新已通知记录 [skip ci]"
            git push
          fi
